name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Code style — Mago formatter check + linter.
  style:
    name: code style · mago
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check formatting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: composer format:check
      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: composer lint

  # Static analysis + generator/header gate (no GUI needed).
  static:
    name: phpstan + gate
    runs-on: macos-latest
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan
        run: composer stan
      - name: Header gate (FFI::cdef accepts the generated header)
        run: composer gate

  # Catch a generate.php / annotations change that wasn't re-run: regenerate from
  # the pinned ui.h and assert the committed output is identical.
  generator-drift:
    name: generator drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Only ui.h is needed (the generator parses just that file). Keep this SHA in
      # sync with LIBUI_REF in build-libui.sh.
      - name: Fetch pinned ui.h
        run: |
          mkdir -p third_party/libui-ng
          curl -fsSL -o third_party/libui-ng/ui.h \
            https://raw.githubusercontent.com/HelgeSverre/libui-ng/ab7d0ff7f7eea5417705c39edc94fe1c51214b93/ui.h
      - name: Regenerate and assert no drift
        run: |
          composer regen
          git diff --exit-code -- src/Generated src/Native/libui.gen.h \
            || { echo '::error::Generated files are stale — run composer regen and commit the result.'; exit 1; }

  native-sanitizers:
    name: native ownership · ASan + UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build libgtk-3-dev xvfb
      - name: Build pinned native source with sanitizers
        run: |
          native_ref="$(python3 -c 'import pathlib, re; print(re.search(r"LIBUI_REF:-([0-9a-f]{40})", pathlib.Path("build-libui.sh").read_text()).group(1))')"
          mkdir -p third_party
          git clone --filter=blob:none https://github.com/HelgeSverre/libui-ng.git third_party/libui-ng
          git -C third_party/libui-ng checkout "$native_ref"
          meson setup third_party/libui-ng/build-asan third_party/libui-ng \
            --buildtype=debug --default-library=shared -Dtests=false -Dexamples=false \
            -Db_sanitize=address,undefined
          ninja -C third_party/libui-ng/build-asan
          cc -g -fsanitize=address,undefined -Ithird_party/libui-ng \
            scripts/native-ownership-test.c -Lthird_party/libui-ng/build-asan/meson-out -lui \
            -Wl,-rpath,"$PWD/third_party/libui-ng/build-asan/meson-out" -o native-ownership-test
      - name: Stress native ownership and UTF-8 text
        env:
          NO_AT_BRIDGE: '1'
          GTK_A11Y: none
          G_DEBUG: fatal-warnings
          # GTK keeps global caches; this job checks invalid accesses and UB.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: xvfb-run -a ./native-ownership-test

  # Build libui on each real OS/arch and run the full suite against it. macOS
  # uses the committed universal dylib; Linux/Windows build from source. GUI
  # tests run headless on Linux via xvfb.
  test:
    name: test · ${{ matrix.label }} · PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     label: darwin-arm64,      php: '8.5' }
          - { os: ubuntu-latest,    label: linux-x86_64,     php: '8.5' }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,     php: '8.5' }
          - { os: windows-latest,   label: windows-x86_64,   php: '8.5' }
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1
          coverage: none

      # macOS runners are arm64 (macos-latest = Apple Silicon). We deliberately do
      # NOT test the Intel (macos-13) runner — it is slow and the committed dylib is
      # already a universal arm64+x86_64 binary covered by the arm64 job.
      - name: Show runner architecture
        shell: bash
        run: uname -m

      # All three platforms now test the COMMITTED prebuilt binaries — the exact
      # artifacts consumers get (lib/darwin/*.dylib, lib/linux-*/*.so,
      # lib/windows-x86_64/*.dll). Linux still needs the GTK 3 runtime to load its
      # .so, and xvfb to run headless. The build pipelines themselves are exercised
      # on demand by build-native.yml.
      - name: GTK 3 runtime + xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 xvfb

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test suite
        shell: bash
        # NO_AT_BRIDGE/GTK_A11Y silence the headless-GTK AT-SPI warning so it can't
        # corrupt PHPUnit's RunInSeparateProcess result serialization (menu tests).
        env:
          NO_AT_BRIDGE: '1'
          GTK_A11Y: none
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a composer test
          else
            composer test
          fi

      - name: Set up MSVC for native rendering regression (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Native entry color rendering (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildScript = Get-Content build-libui.sh -Raw
          $nativeRef = [regex]::Match($buildScript, 'LIBUI_REF="\$\{LIBUI_REF:-([0-9a-f]{40})\}"').Groups[1].Value
          if (!$nativeRef) { throw 'Cannot read the pinned native revision' }
          New-Item -ItemType Directory -Force third_party/libui-ng | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/HelgeSverre/libui-ng/$nativeRef/ui.h" -OutFile third_party/libui-ng/ui.h
          cl /nologo /EHsc /Ithird_party/libui-ng scripts/windows-entry-color-test.cpp user32.lib gdi32.lib /Fe:windows-entry-color-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\windows-entry-color-test.exe (Resolve-Path lib/windows-x86_64/libui.dll).Path
          exit $LASTEXITCODE
